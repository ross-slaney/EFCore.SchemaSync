name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"

jobs:
  build-and-test:
    name: Build, test, pack (SQL Server ${{ matrix.sql }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sql: ["2022-latest", "2025-latest"]
    env:
      SCHEMASYNC_SQL_IMAGE_TAG: ${{ matrix.sql }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Pre-pull so the Aspire-orchestrated container start does not count against test timeouts.
      - name: Pull SQL Server ${{ matrix.sql }} image
        run: docker pull mcr.microsoft.com/mssql/server:${{ matrix.sql }}
        continue-on-error: true

      - name: Restore
        run: dotnet restore EFCore.SchemaSync.slnx

      - name: Build
        run: dotnet build EFCore.SchemaSync.slnx --configuration Release --no-restore

      - name: Unit tests (schema conversion, no SQL Server)
        run: >
          dotnet test tests/EFCore.SchemaSync.Tests/EFCore.SchemaSync.Tests.csproj
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=UnitTests.trx"
          --results-directory TestResults

      - name: Integration and end-to-end tests (Aspire + SQL Server ${{ matrix.sql }} container)
        run: >
          dotnet test tests/EFCore.SchemaSync.IntegrationTests/EFCore.SchemaSync.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=IntegrationTests.trx"
          --results-directory TestResults

      - name: Pack
        if: matrix.sql == '2022-latest'
        run: dotnet pack src/EFCore.SchemaSync/EFCore.SchemaSync.csproj --configuration Release --no-build --output ./nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.sql }}
          path: TestResults/**
          if-no-files-found: ignore

      - name: Upload package
        if: matrix.sql == '2022-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*

  azure-sql:
    name: Azure SQL Database (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Runs only when the repository has the secrets below; forks and unconfigured repos skip it.
    permissions:
      contents: read
      id-token: write
    env:
      SCHEMASYNC_AZURE_SQL_CONNECTION_STRING: ${{ secrets.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Not configured
        if: env.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING == ''
        run: echo "Set the SCHEMASYNC_AZURE_SQL_CONNECTION_STRING repository secret (and optionally AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID for Entra ID) to run the Azure SQL tests."

      - name: Checkout
        if: env.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING != ''
        uses: actions/checkout@v4

      - name: Setup .NET
        if: env.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Azure login (Entra ID token test)
        if: env.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING != '' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch an access token for Azure SQL
        if: env.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING != '' && env.AZURE_CLIENT_ID != ''
        run: |
          token=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "SCHEMASYNC_AZURE_SQL_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Azure SQL tests
        if: env.SCHEMASYNC_AZURE_SQL_CONNECTION_STRING != ''
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: >
          dotnet test tests/EFCore.SchemaSync.IntegrationTests/EFCore.SchemaSync.IntegrationTests.csproj
          --configuration Release
          --filter "TestCategory=AzureSql"
          --logger "console;verbosity=normal"
